<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="referrer" content="origin"/>
<meta name="color-scheme" content="dark"/>
<title>HUMANITY STUDIO · клиентский бриф</title>
<style>
:root {
  --bg:#0b0b0a; --surface:#141412; --raised:#1c1c18; --paper:#f3efe6; --paper-mid:#eae4d6;
  --ink:#161513; --ink-soft:#3f3c36; --fg:#f3efe6; --muted:#9a958a; --subtle:#6f6b62;
  --accent:#d4b15a; --accent-fg:#1a1408; --gold:#d4b15a; --gold-bright:#f3e0a0; --gold-deep:#8a6914; --border:#2a2924; --danger:#b4544a; --ok:#5c7a62;
  --display: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin:0; min-height:100%; background:var(--bg); color:var(--fg); font: 16px/1.5 var(--sans); }
button, [role="button"] { cursor: pointer; font: inherit; }
button:disabled { cursor: default; opacity:.4; }
h1,h2,h3 { text-wrap:balance; font-family:var(--display); font-weight:500; }
button:not(.chip):not(.nav-btn):not(.icon-btn):not(.ghost-link) {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:44px; padding:0 18px; border:0; border-radius:8px;
  background:var(--accent); color:var(--accent-fg); font-weight:500;
  transition: transform 150ms ease-out, opacity 150ms ease-out;
}
button:not(.chip):not(.nav-btn):not(.icon-btn):not(.ghost-link):hover { opacity:.9; }
button:not(.chip):not(.nav-btn):not(.icon-btn):not(.ghost-link):active { transform: scale(.96); }
.btn-outline { background:transparent !important; color:var(--fg) !important; box-shadow:0 0 0 1px color-mix(in oklab, var(--fg) 12%, transparent); }
.btn-ghost { background:transparent !important; color:var(--fg) !important; }
.btn-paper { background:var(--paper) !important; color:var(--ink) !important; }
.icon-btn { width:44px; height:44px; border:0; border-radius:8px; background:transparent; color:var(--fg); }
.cover { position:relative; min-height:100dvh; overflow:hidden; padding:20px 20px 64px; }
.blob { position:absolute; border-radius:50%; filter:blur(64px); pointer-events:none; background:var(--raised); }
.cover-grid { max-width:1100px; margin:48px auto 0; display:grid; gap:40px; align-items:center; }
@media (min-width: 960px) { .cover-grid { grid-template-columns: 1.1fr .9fr; } }
.kicker { font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
.display { font-size:clamp(42px, 8vw, 72px); line-height:1.05; letter-spacing:-.03em; margin:16px 0; }
.display em { font-style:italic; color:var(--muted); font-weight:400; }
.lead { max-width:28rem; color:var(--muted); }
.actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
.stage-wrap { position:relative; width:min(320px,78vw); height:min(320px,78vw); perspective:900px; margin:0 auto; transform-style:preserve-3d; }
.stage-floor { position:absolute; left:12%; right:12%; bottom:4%; height:22%; border-radius:50%;
  background:radial-gradient(ellipse at center, color-mix(in oklab, var(--gold) 28%, transparent), transparent 70%);
  transform: rotateX(68deg); animation: floor-pulse 8s ease-in-out infinite; }
.stage-disc { position:absolute; inset:12%; border-radius:50%; overflow:visible; background:transparent;
  transform-style:preserve-3d; animation: stage-tilt 12s cubic-bezier(.22,1,.36,1) infinite; }
.stage-hand { width:100%; height:100%; object-fit:contain; filter: drop-shadow(0 0 18px color-mix(in oklab, var(--gold) 45%, transparent)) drop-shadow(0 18px 28px rgba(0,0,0,.45)); animation: hand-breathe 5.8s ease-in-out infinite; }
.stage-gleam { pointer-events:none; position:absolute; inset:0; border-radius:50%;
  background:linear-gradient(115deg, transparent 28%, color-mix(in oklab, var(--gold-bright) 70%, white) 48%, transparent 64%);
  mix-blend-mode:screen; opacity:0; animation: gleam-sweep 5.6s ease-in-out infinite;
  -webkit-mask-image: var(--hand-mask); mask-image: var(--hand-mask);
  -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  -webkit-mask-position: center; mask-position: center; }
.stage-glow { position:absolute; inset:18%; border-radius:50%; background:radial-gradient(circle, color-mix(in oklab, var(--gold) 28%, transparent), transparent 70%); filter:blur(16px); animation: floor-pulse 6s ease-in-out infinite; }
.stage-orbit { position:absolute; inset:0; border-radius:50%; border:1px dashed color-mix(in oklab, var(--gold) 38%, transparent); animation: orbit-spin 28s linear infinite; }
.stage-orbit.b { inset:6%; animation-duration:40s; animation-direction:reverse; border-style:solid; border-color:color-mix(in oklab, var(--gold) 18%, transparent); }
.stage-orbit.c { inset:12%; animation-duration:22s; border-style:dotted; }
.cover-orbit { position:absolute; inset:-14%; pointer-events:none; animation: orbit-spin 48s linear infinite; }
.cover-chip { position:absolute; padding:6px 10px; border-radius:999px; font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--gold-bright); background:color-mix(in oklab, var(--surface) 88%, var(--gold)); box-shadow:0 0 0 1px color-mix(in oklab, var(--gold) 42%, transparent); animation: orbit-spin 48s linear infinite reverse; pointer-events:auto; cursor:pointer; }
.cover-chip-a { top:4%; left:50%; transform:translateX(-50%); }
.cover-chip-b { right:-6%; top:46%; }
.cover-chip-c { bottom:6%; left:8%; }
@keyframes orbit-spin { to { transform: rotate(360deg); } }
@keyframes stage-tilt { 0%,100% { transform: rotateY(-10deg) rotateX(6deg);} 50% { transform: rotateY(10deg) rotateX(-4deg);} }
.edit { min-height:100dvh; }
.topbar { position:sticky; top:0; z-index:20; border-bottom:1px solid var(--border); background:color-mix(in oklab, var(--bg) 92%, transparent); backdrop-filter: blur(8px);
  display:flex; align-items:center; gap:12px; padding:12px 16px; }
.progress { height:3px; background:var(--raised); border-radius:99px; overflow:hidden; margin-top:8px; }
.progress > i { display:block; height:100%; background:var(--fg); width:0; transition: width 250ms ease; }
.layout { max-width:1120px; margin:0 auto; display:grid; }
@media (min-width: 1024px) { .layout { grid-template-columns: 200px 1fr; } }
.side { display:none; padding:24px 16px; border-right:1px solid var(--border); }
@media (min-width: 1024px) { .side { display:flex; flex-direction:column; } }
.nav-btn { display:flex; width:100%; justify-content:space-between; align-items:baseline; gap:8px; padding:10px 12px; border:0; border-radius:8px; background:transparent; color:var(--muted); text-align:left; }
.nav-btn.on { background:var(--raised); color:var(--fg); }
.paper { background:var(--paper); color:var(--ink); border-radius:16px; padding:28px 24px 36px; box-shadow:0 24px 64px rgba(0,0,0,.42);
  transform: perspective(1200px) rotateX(1.2deg); }
.paper h1 { margin:8px 0 8px; font-size:clamp(28px,4vw,36px); letter-spacing:-.02em; }
.hint { color:var(--ink-soft); font-size:13px; }
.field { display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
.field label { font-size:14px; font-weight:500; }
.req { color:var(--danger); }
input[type=text], input[type=email], input[type=url], input[type=tel], input[type=date], textarea {
  width:100%; min-height:44px; border:0; border-radius:8px; padding:10px 12px; background:var(--paper-mid); color:var(--ink);
  box-shadow: 0 0 0 1px color-mix(in oklab, var(--ink) 12%, transparent); font: inherit;
}
textarea { min-height:110px; resize:vertical; }
.grid2 { display:grid; gap:16px; }
@media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { min-height:40px; padding:0 12px; border-radius:8px; border:0; background:transparent; color:var(--ink-soft);
  box-shadow:0 0 0 1px color-mix(in oklab, var(--ink) 12%, transparent); }
.chip.on { background:var(--ink); color:var(--paper); box-shadow:none; }
.drop { min-height:112px; border-radius:12px; padding:16px; background:var(--paper-mid); color:var(--ink-soft); font-size:13px;
  box-shadow:0 0 0 1px color-mix(in oklab, var(--ink) 12%, transparent); }
.file { display:flex; align-items:center; gap:10px; margin-top:8px; padding:8px; background:var(--paper-mid); border-radius:8px; font-size:13px; }
.file img { width:40px; height:40px; object-fit:contain; border-radius:4px; }
.bar { display:flex; justify-content:space-between; gap:12px; max-width:760px; margin:20px auto 40px; padding:0 16px; }
.overlay { position:fixed; inset:0; z-index:40; background:color-mix(in oklab, var(--bg) 86%, transparent); display:flex; flex-direction:column; align-items:center; justify-content:center; }
.sent { max-width:760px; margin:0 auto; padding:48px 20px 80px; text-align:center; }
.plan h3 { font-size:22px; border-bottom:1px solid color-mix(in oklab, var(--ink) 15%, transparent); padding-bottom:8px; }
.meta { display:grid; gap:12px; margin:20px 0; }
@media (min-width: 640px) { .meta { grid-template-columns:1fr 1fr; } }
.meta > div, .variant { background:var(--paper-mid); border-radius:12px; padding:14px 16px; }
.mobile-nav { display:flex; gap:6px; overflow:auto; padding:0 12px 12px; }
@media (min-width: 1024px) { .mobile-nav { display:none; } }
.mobile-nav button { flex:none; min-height:40px; padding:0 12px; background:transparent; color:var(--muted); box-shadow:none; font-family:var(--mono); font-size:12px; }
.mobile-nav button.on { background:var(--accent); color:var(--accent-fg); }
.toc { max-width:320px; margin:32px auto 0; }
.toc li { display:flex; justify-content:space-between; border-bottom:1px solid var(--border); padding:10px 0; color:var(--fg); list-style:none; }
.toc { padding:0; }
.mono { font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--subtle); }
.mark { height:32px; width:auto; }
@keyframes floor-pulse { 0%,100%{opacity:.45} 50%{opacity:.85} }
@keyframes gleam-sweep { 0%,18%{transform:translateX(-70%) rotate(16deg);opacity:0} 32%{opacity:.85} 58%,100%{transform:translateX(70%) rotate(16deg);opacity:0} }
@keyframes gold-shimmer { to { background-position: 220% 0; } }
@keyframes letter-in { from { opacity:0; transform:translateY(14px) rotateX(42deg); filter:blur(5px);} to { opacity:1; transform:none; filter:none;} }
@keyframes hand-breathe { 0%,100%{filter:drop-shadow(0 0 16px color-mix(in oklab, var(--gold) 42%, transparent)) drop-shadow(0 18px 28px rgba(0,0,0,.45))} 50%{filter:drop-shadow(0 0 32px color-mix(in oklab, var(--gold-bright) 78%, transparent)) drop-shadow(0 18px 28px rgba(0,0,0,.45))} }
@keyframes title-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
.gold-pollen { position:fixed; inset:0; z-index:80; width:100%; height:100%; pointer-events:none; }
.gold-title { display:flex; flex-direction:column; max-width:36rem; font-family:var(--display); font-size:clamp(42px,8vw,72px); font-weight:500; line-height:1.05; letter-spacing:-.03em; perspective:600px; margin:16px 0; animation: title-float 9s ease-in-out infinite; }
.widgets { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:min(360px,100%); margin:12px auto 0; }
.pulse-card { position:relative; overflow:hidden; border-radius:16px; background:color-mix(in oklab, var(--surface) 88%, var(--gold)); padding:14px 12px; box-shadow:0 0 0 1px color-mix(in oklab, var(--gold) 28%, transparent); cursor:pointer; }
.pulse-card:hover { box-shadow:0 0 0 1px color-mix(in oklab, var(--gold) 48%, transparent), 0 0 24px color-mix(in oklab, var(--gold) 28%, transparent); }
.pulse-ring { position:absolute; right:-12px; top:-12px; width:56px; height:56px; border-radius:50%; border:1px solid color-mix(in oklab, var(--gold) 42%, transparent); animation: orbit-spin 18s linear infinite; }
.pulse-card .display { font-size:28px; margin:4px 0; }
.gold-line { display:block; }
.gold-line-italic { font-style:italic; font-weight:400; }
.gold-letter { display:inline-block; background-image:linear-gradient(100deg,#8a6914 0%,#d4b15a 22%,#fff6d4 48%,#e8c56a 62%,#8a6914 100%); background-size:220% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation: letter-in 720ms cubic-bezier(.22,1,.36,1) both, gold-shimmer 7s linear infinite; animation-delay: calc(var(--i) * 55ms), calc(520ms + var(--i) * 55ms); }
.gold-wordmark { display:inline-flex; font-family:var(--mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; }
.gold-mark { height:32px; width:32px; object-fit:contain; cursor:pointer; filter: drop-shadow(0 0 10px color-mix(in oklab, var(--gold) 40%, transparent)); }
@media (prefers-reduced-motion: reduce) {
  .stage-disc, .stage-orbit, .cover-orbit, .cover-chip, .stage-floor, .stage-glow, .stage-gleam, .gold-letter, .stage-hand, .gold-title, .pulse-ring { animation:none; }
  .gold-letter { color:var(--gold-bright); background:none; -webkit-background-clip:unset; background-clip:unset; }
  .paper { transform:none; }
}
</style>

function load() {
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved.brief) state.brief = Object.assign(emptyBrief(), saved.brief);
    if (typeof saved.step === "number") state.step = saved.step;
  } catch {}
}
function persist() {
  try { localStorage.setItem(STORE, JSON.stringify({brief: state.brief, step: state.step})); } catch {}
}
load();

function filled(v) { return Array.isArray(v) ? v.length > 0 : String(v||"").trim().length > 0; }
function isEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||"").trim()); }
function optLabel(group, id) {
  const row = (OPTIONS[group]||[]).find(x => x[0]===id);
  return row ? row[1] : id;
}
function missing() {
  const b = state.brief;
  const hasValue = filled(b.usp) || filled(b.productDescription);
  const hasObj = filled(b.communicationTask) || filled(b.marketingObjective);
  return REQUIRED.filter(k => {
    if (k==="usp" || k==="productDescription") return !hasValue && k==="usp";
    if (k==="communicationTask" || k==="marketingObjective") return !hasObj && k==="communicationTask";
    if (k==="contactEmail") return !isEmail(b.contactEmail);
    return !filled(b[k]);
  });
}
function score() {
  const keys = Object.values(FIELDS).flat().map(f => f[0]);
  const n = keys.filter(k => filled(state.brief[k])).length;
  const files = Math.min(state.assets.length, 4) / 4;
  return Math.round(((n/keys.length)*0.9 + files*0.1)*100);
}

function esc(s) {
  return String(s||"").split("").map(function(ch) {
    if (ch === "&") return "\u0026amp;";
    if (ch === "<") return "\u0026lt;";
    if (ch === ">") return "\u0026gt;";
    if (ch === '"') return "\u0026quot;";
    return ch;
  }).join("");
}
function nl(s) { return esc(s).replace(/\n/g,"<br/>"); }

function fieldLabel(key) {
  for (const list of Object.values(FIELDS)) {
    const f = list.find(x => x[0]===key);
    if (f) return f[1];
  }
  return key;
}

function buildText(plan) {
  const b = state.brief;
  const lines = ["HUMANITY STUDIO · " + b.id, title(), ""];
  for (const list of Object.values(FIELDS)) {
    for (const f of list) {
      let v = b[f[0]];
      if (Array.isArray(v)) v = v.map(id => optLabel(f[0]==="channels"?"channels":f[0]==="toneOfVoice"?"tone":f[0]==="brandPersonality"?"personality":f[0], id) || optLabel("channels", id)).join(", ");
      if (v && String(v).trim()) lines.push(f[1] + ": " + v);
    }
  }
  lines.push("", "ПАКЕТ ПРОДАКШЕНА", plan.summary, "Формат: "+plan.format,
    "Фильм: "+plan.film.title+" · "+plan.film.duration+" · "+plan.film.resolution);
  plan.videos.forEach(v => lines.push("• "+v.name+" — "+v.duration+", "+v.aspect+", "+v.platforms));
  return lines.join("\n");
}

function downloadBlob(content, name, type) {
  const blob = content instanceof Blob ? content : new Blob([content], {type: type||"text/html;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function filename() {
  const slug = (state.brief.projectName || state.brief.companyName || state.brief.id).toLowerCase().replace(/[^a-z0-9а-яё]+/gi,"-").replace(/^-|-$/g,"").slice(0,48);
  return "Brief-" + (slug || state.brief.id) + ".html";
}

function dataUrlToBlob(dataUrl) {
  const m = /^data:([^;]+);base64,(.+)$/.exec(dataUrl||"");
  if (!m) return null;
  const bin = atob(m[2]);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], {type:m[1]});
}

function abortAfter(ms) {
  try {
    if (typeof AbortSignal !== "undefined" && typeof AbortSignal.timeout === "function") return AbortSignal.timeout(ms);
  } catch (e) {}
  const c = new AbortController();
  setTimeout(function() { try { c.abort(); } catch (e) {} }, ms);
  return c.signal;
}
function mailFields(textDoc) {
  const body = {
    name: (state.brief.contactName || state.brief.companyName).slice(0,120),
    email: state.brief.contactEmail.trim(),
    _replyto: state.brief.contactEmail.trim(),
    subject: "HUMANITY STUDIO · " + title() + " · " + state.brief.id,
    _subject: "HUMANITY STUDIO · " + title() + " · " + state.brief.id,
    message: (textDoc || "").slice(0, 4500) || "Бриф HUMANITY STUDIO",
    "студия": "HUMANITY STUDIO",
    "получатель": RECIPIENT,
    "документ": filename(),
    "материалы": state.assets.map(function(a){ return a.name; }).join(", ") || "нет отдельных файлов",
    _gotcha: ""
  };
  const more = (textDoc || "").slice(4500, 9000).trim();
  if (more) body["бриф_продолжение"] = more;
  const planPart = (textDoc || "").slice(9000, 14000).trim();
  if (planPart) body["пакет_продакшена"] = planPart;
  return body;
}
function asFormData(body) {
  const fd = new FormData();
  Object.keys(body).forEach(function(k){ fd.append(k, body[k]); });
  return fd;
}
function fireBeacon(body) {
  try { if (navigator.sendBeacon) navigator.sendBeacon(FORMSPREE, asFormData(body)); } catch (e) {}
}
function hiddenFormPost(body) {
  return new Promise(function(resolve) {
    try {
      const name = "hsmail" + Date.now();
      const iframe = document.createElement("iframe");
      iframe.name = name;
      iframe.setAttribute("aria-hidden", "true");
      iframe.style.cssText = "position:absolute;width:1px;height:1px;opacity:0;left:-9999px;border:0";
      const form = document.createElement("form");
      form.method = "POST";
      form.action = FORMSPREE;
      form.target = name;
      form.acceptCharset = "UTF-8";
      form.style.display = "none";
      Object.keys(body).forEach(function(k) {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = k;
        input.value = body[k];
        form.appendChild(input);
      });
      document.body.appendChild(iframe);
      document.body.appendChild(form);
      let done = false;
      const finish = function(ok) {
        if (done) return;
        done = true;
        resolve(ok);
        setTimeout(function() { try { iframe.remove(); form.remove(); } catch (e) {} }, 800);
      };
      iframe.onload = function() { finish(true); };
      form.submit();
      setTimeout(function() { finish(true); }, 3500);
    } catch (e) { resolve(false); }
  });
}
function openStudioMail() {
  try {
    const a = document.createElement("a");
    a.href = mailtoHref();
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();
    return true;
  } catch (e) {
    try { location.href = mailtoHref(); return true; } catch (e2) { return false; }
  }
}
async function readOk(res) {
  if (!res) return false;
  if (res.type === "opaque") return true;
  let raw = "";
  try { raw = await res.text(); } catch (e) {}
  let parsed = {};
  try { parsed = JSON.parse(raw); } catch (e) {}
  if (parsed && parsed.ok === true) return true;
  if (parsed && parsed.success === true) return true;
  if (res.ok && !parsed.error) return true;
  return false;
}
async function sendMail(htmlDoc, textDoc, plan) {
  const body = mailFields(textDoc);
  fireBeacon(body);
  try {
    const res = await fetch(FORMSPREE, {
      method: "POST",
      headers: { Accept: "application/json", "Content-Type": "application/json" },
      body: JSON.stringify(body),
      mode: "cors",
      signal: abortAfter(14000)
    });
    if (await readOk(res)) return { ok: true, via: "ajax" };
  } catch (e) {}
  try {
    const res = await fetch(FORMSPREE, {
      method: "POST",
      headers: { Accept: "application/json" },
      body: asFormData(body),
      mode: "cors",
      signal: abortAfter(12000)
    });
    if (await readOk(res)) return { ok: true, via: "formdata" };
  } catch (e) {}
  try {
    if (await hiddenFormPost(body)) return { ok: true, via: "form" };
  } catch (e) {}
  openStudioMail();
  return { ok: true, via: "mailto" };
}

function goldLetters(text, off) {
  off = off || 0;
  return Array.from(text).map(function(ch, i) {
    const g = ch === " " ? "\u00a0" : ch;
    return '<span class="gold-letter" style="--i:' + (off + i) + '">' + g + "</span>";
  }).join("");
}

function renderField(f) {
  const [key,label,type,req,hint] = f;
  const val = state.brief[key];
  let body = "";
  if (type==="chips" || type==="chips-multi") {
    const group = key==="projectType"?"projectType":key==="budgetRange"?"budget":key==="brandPersonality"?"personality":key==="pricePosition"?"price":key==="funnelStage"?"funnel":key==="toneOfVoice"?"tone":key==="channels"?"channels":"";
    const multi = type==="chips-multi";
    const selected = Array.isArray(val) ? val : val ? [val] : [];
    body = `<div class="chips">${(OPTIONS[group]||[]).map(([id,l]) => `<button type="button" class="chip${selected.includes(id)?" on":""}" data-chip="${key}" data-id="${id}" data-multi="${multi?1:0}">${esc(l)}</button>`).join("")}</div>`;
  } else if (type==="area") {
    body = `<textarea data-key="${key}" rows="4">${esc(val)}</textarea>`;
  } else {
    body = `<input type="${type==="url"?"url":type==="email"?"email":type==="tel"?"tel":type==="date"?"date":"text"}" data-key="${key}" value="${esc(val)}"/>`;
  }
  return `<div class="field"><label>${esc(label)}${req?' <span class="req">·</span>':""}</label>${body}${hint?`<span class="hint">${esc(hint)}</span>`:""}</div>`;
}

    ["reference","Референсы","image/*,.pdf"]

  return kinds.map(([kind,title,accept]) => {
    const mine = state.assets.filter(a => a.kind===kind);
    return `<div class="field"><label>${esc(title)}</label>
      <div class="drop" data-drop="${kind}">Перетащите или выберите. PNG, JPG, PDF, ZIP, DOC — до 8 МБ.

      ? "Бриф и пакет продакшена ушли на "+RECIPIENT+". HTML-документ с логотипом студии сохранён на это устройство."
      : "Документ сохранён. Нажмите «Открыть почту» и затем «Отправить» — адрес студии уже подставлен."}</p>
    <p class="kicker" style="margin-top:12px">${RECIPIENT}</p>
    <div class="actions" style="justify-content:center">
      ${state.mailed && state.mailVia!=="mailto"?"":`<a href="${mailtoHref()}"><button type="button">Открыть почту</button></a>
        <button type="button" class="btn-outline" data-act="send">Повторить отправку</button>`}
      <button type="button" class="${state.mailed?"":"btn-ghost"}" data-act="download-doc">Скачать документ</button>
      <button type="button" class="btn-outline" data-act="reset">Собрать ещё один</button>
    </div>
    <div class="paper" style="text-align:left;margin-top:48px">${renderPlan(plan)}</div>
  </main>`;
}

function mailtoHref() {
  const plan = state.plan || makePlan(state.brief);
  const subject = encodeURIComponent("HUMANITY STUDIO · " + title() + " · " + state.brief.id);
  const body = encodeURIComponent(buildText(plan).slice(0,1800));
  return "mailto:"+RECIPIENT+"?subject="+subject+"&body="+body;
}

function render() {
  const root = document.getElementById("app");
  root.innerHTML = state.phase==="cover" ? renderCover() : (state.phase==="sent"||state.phase==="failed") ? renderSent() : renderEdit();
  bind();
}

function bind() {
  document.querySelectorAll("[data-act]").forEach(el => el.addEventListener("click", onAct));
  document.querySelectorAll("[data-step]").forEach(el => el.addEventListener("click", () => { state.step = +el.dataset.step; state.phase="edit"; persist(); render(); }));
  document.querySelectorAll("[data-key]").forEach(el => el.addEventListener("input", () => { state.brief[el.dataset.key] = el.value; persist(); }));
  document.querySelectorAll("[data-chip]").forEach(el => el.addEventListener("click", () => {
    const key = el.dataset.chip, id = el.dataset.id, multi = el.dataset.multi==="1";
    if (multi) {
      const cur = Array.isArray(state.brief[key]) ? state.brief[key].slice() : [];
      const i = cur.indexOf(id);
      if (i>=0) cur.splice(i,1); else cur.push(id);
      state.brief[key] = cur;
    } else {
      state.brief[key] = state.brief[key]===id ? "" : id;
    }
    persist(); render();
  }));
  document.querySelectorAll("[data-jump]").forEach(el => el.addEventListener("click", () => {
    const key = el.dataset.jump;
    for (const [sid, list] of Object.entries(FIELDS)) {
      if (list.some(f => f[0]===key)) {
        state.step = STEPS.findIndex(s => s.id===sid);
        state.phase = "edit";
        persist(); render();
      }
    }
  }));
  document.querySelectorAll("input[type=file]").forEach(el => el.addEventListener("change", async (e) => {
    const kind = el.dataset.kind;
    for (const file of [...el.files]) {
      if (file.size > 8*1024*1024) continue;
      const dataUrl = await readFile(file);
      state.assets.push({id: kind+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,6), kind, name:file.name, type:file.type, size:file.size, dataUrl});
    }
    render();
  }));
  document.querySelectorAll("[data-remove]").forEach(el => el.addEventListener("click", () => {
    state.assets = state.assets.filter(a => a.id !== el.dataset.remove);
    render();
  }));
  document.querySelectorAll("[data-drop]").forEach(el => {
    el.addEventListener("dragover", e => { e.preventDefault(); });
    el.addEventListener("drop", async e => {
      e.preventDefault();
      const kind = el.dataset.drop;
      const input = el.querySelector("input[type=file]");
      if (e.dataTransfer.files.length && input) {
        input.files = e.dataTransfer.files;
        input.dispatchEvent(new Event("change"));
      }
    });
  });
}

function readFile(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result));
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function onAct(e) {
  const act = e.currentTarget.dataset.act;
  if (act==="start" || act==="continue") { if (act==="start") { state.brief = emptyBrief(); state.assets=[]; state.step=0; } state.phase="edit"; persist(); render(); return; }
  if (act==="cover") { state.phase="cover"; render(); return; }
  if (act==="sample") { state.brief = sampleBrief(); state.assets=[]; state.step=0; state.phase="edit"; persist(); render(); return; }
  if (act==="reset") { if (!confirm("Сбросить бриф и начать заново?")) return; state.brief=emptyBrief(); state.assets=[]; state.step=0; state.phase="cover"; state.plan=null; persist(); render(); return; }
  if (act==="next") { state.step = Math.min(STEPS.length-1, state.step+1); persist(); render(); return; }
  if (act==="back") { if (state.step===0) state.phase="cover"; else state.step--; persist(); render(); return; }
  if (act==="review") { state.phase="review"; render(); return; }
  if (act==="download-doc") {
    const plan = state.plan || makePlan(state.brief);
    downloadBlob(buildDocument(plan), filename());
    return;
  }
  if (act==="send") {
    const miss = missing();
    if (miss.length) { state.phase="review"; render(); return; }
    if (!navigator.onLine) { alert("Для отправки нужна сеть. Документ можно скачать сейчас."); downloadBlob(buildDocument(makePlan(state.brief)), filename()); return; }
    state.sending = true; render();
    const plan = makePlan(state.brief);
    state.plan = plan;
    const htmlDoc = buildDocument(plan);
    const textDoc = buildText(plan);
    let mailed = false;
    let via = "";
    try {
      const r = await sendMail(htmlDoc, textDoc, plan);
      mailed = !!(r && r.ok);
      via = (r && r.via) || "";
    } catch (err) {
      via = "error";
    }
    if (!mailed) {
      mailed = openStudioMail();
      via = "mailto";
    }
    downloadBlob(htmlDoc, filename());
    state.sending = false;
    state.mailed = mailed;
    state.mailVia = via;
    state.phase = mailed ? "sent" : "failed";
    render();
  }
}


(function initPollen(){
  const canvas = document.getElementById("pollen");
  if (!canvas || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx = canvas.getContext("2d");
  if (!ctx) return;
  const specks = [];
  const resize = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
  };
  resize();
  addEventListener("resize", resize);
  const burst = (x, y) => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const n = 64 + Math.floor(Math.random() * 28);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (1.1 + Math.random() * 6.2) * dpr;
      specks.push({ x:x, y:y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 1.4*dpr, life: 1, decay: 0.008+Math.random()*0.012, size: (0.9+Math.random()*2.6)*dpr, rot: Math.random()*Math.PI, vr: (Math.random()-0.5)*0.22, stretch: 0.45+Math.random()*0.7 });
    }
  };
  document.addEventListener("click", (e) => {
    const el = e.target;
    if (!(el instanceof Element)) return;
    if (!el.closest("button, [role=button], a, .chip, .stage-wrap, .gold-mark, .gold-wordmark, .gold-title, .gold-letter, .cover-chip, .icon-btn, .pulse-card, img, svg")) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    burst((e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr);
  }, true);
  let idle = 0;
  const tick = () => {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    idle += 1;
    if (idle % 42 === 0 && specks.length < 36) {
      const host = document.querySelector(".stage-wrap, .gold-mark");
      if (host) {
        const r = host.getBoundingClientRect();
        const cr = canvas.getBoundingClientRect();
        const x = (r.left + r.width * (0.3 + Math.random()*0.4) - cr.left) * dpr;
        const y = (r.top + r.height * (0.28 + Math.random()*0.4) - cr.top) * dpr;
        for (let i = 0; i < 3; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = (0.6 + Math.random() * 2.4) * dpr;
          specks.push({ x:x, y:y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 0.8*dpr, life: 1, decay: 0.01+Math.random()*0.012, size: (0.8+Math.random()*2)*dpr, rot: Math.random()*Math.PI, vr: (Math.random()-0.5)*0.2, stretch: 0.45+Math.random()*0.6 });
        }
      }
    }
    for (let i = specks.length - 1; i >= 0; i--) {
      const p = specks[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.045 * dpr; p.vx *= 0.986; p.vy *= 0.992; p.life -= p.decay; p.rot += p.vr;
      if (p.life <= 0) { specks.splice(i,1); continue; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.max(0, p.life);
      const g = ctx.createRadialGradient(0,0,0,0,0,p.size*3.2);
      g.addColorStop(0,"rgba(255,246,212,0.95)"); g.addColorStop(0.35,"rgba(232,197,106,0.85)"); g.addColorStop(1,"rgba(138,105,20,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0,0,p.size*1.15,p.size*p.stretch,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "rgba(255,250,230,0.9)"; ctx.beginPath(); ctx.ellipse(0,0,p.size*0.35,p.size*0.18,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
render();
</script>
</body>
</html>
